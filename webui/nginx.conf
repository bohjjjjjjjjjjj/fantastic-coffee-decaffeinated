server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: le rotte lato client (vue-router history mode) ricadono su index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lunga per gli asset con hash nel nome.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
