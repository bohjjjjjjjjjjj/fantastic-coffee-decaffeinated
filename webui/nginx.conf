server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: le rotte lato client (vue-router history mode) ricadono su index.html.
    # index.html non va mai messo in cache: e' l'unico file che dice al browser
    # quale bundle caricare, e i bundle cambiano nome a ogni build. Senza questo
    # il browser puo' riusare una pagina vecchia e mostrare la versione
    # precedente dell'app anche dopo un deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache lunga per gli asset con hash nel nome.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
