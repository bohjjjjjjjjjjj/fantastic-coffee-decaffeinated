
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: wasatext-backend
    ports:
      - "3000:3000"
    volumes:
      - wasa-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: wasatext-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wasa-data:
